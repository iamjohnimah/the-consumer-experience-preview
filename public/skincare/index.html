function routine(at=period){const extras=!state.flow?.basicPlan&&state.profile?.pace==='A little extra care'&&!state.profile?.sensitive&&!state.profile?.avoid&&state.profile?.adult;const eligible=state.shelf.filter(p=>p.confirmed&&p.include&&p.category!=='Treatment'&&p.category!=='Other'&&(p.period==='Both'||p.period===at)&&(p.category!=='Optional care'||extras));let slots=['Cleanse',...(extras?['Optional care']:[]),'Moisturize',...(at==='Morning'?['Protect']:[])];return slots.map(category=>{let p=eligible.filter(x=>x.category===category).sort((a,b)=>(Number(b.priority)||0)-(Number(a.priority)||0))[0];return p?{...resolve(p),owned:true}:{id:'gap-'+category,category,name:category==='Protect'?'Choose your sun protection':category==='Cleanse'?'Choose your cleanser':category==='Moisturize'?'Choose your moisturizer':'Optional care is not selected',gap:true}}).filter(p=>!(p.gap&&p.category==='Optional care'))}
function stepKey(p,at=period){return `${localDay()}-${at}-${p.id}`}
function stepStatus(p,at=period){let v=state.done[stepKey(p,at)];return v===true?'done':v===false?null:v}
function routineSteps(at=period){return routine(at).map((p,i)=>{let status=stepStatus(p,at);return `<div class="step"><button class="check ${status==='done'?'complete':''} ${status==='skipped'?'skipstep':''}" data-toggle-step="${esc(p.id)}" aria-pressed="${status==='done'}" aria-label="${status==='done'?'Undo completion of':'Mark complete:'} ${esc(p.name)}" ${p.gap?'disabled':''}>${status==='done'?icon('check'):status==='skipped'?'Skip':i+1}</button><div class="stepcopy"><strong>${esc(p.category)}</strong><p>${esc(p.name)}</p>${p.gap?'<span class="pill warn">Select a product</span>':`<span class="small muted">${status==='done'?'Completed today':status==='skipped'?'Skipped today':esc(p.period)+' · label directions'}</span>`}</div>${p.gap?'<button class="textbutton" data-action="shelf">Choose</button>':`<button class="textbutton" data-item="${esc(p.id)}">Details</button>`}</div>`}).join('')}
function suggestionCard(p){let owned=state.shelf.some(x=>x.catalogId===p.id);return '<article class="card product suggestion">'+pack(p)+'<div class="product-body"><div class="row"><span class="eyebrow">'+esc(p.brand)+'</span><span class="pill">'+esc(p.category)+'</span></div><h3>'+esc(p.name)+'</h3><p>'+esc(p.reason||p.detail)+'</p><div class="actions"><button data-catalog="'+p.id+'">Why & product details '+icon('arrow')+'</button><button class="textbutton" '+(owned?'data-action="shelf"':'data-add-catalog="'+p.id+'"')+'>'+(owned?'On your shelf':'I own this')+'</button></div></div></article>'}

function week(){return '<div class="week">'+Array.from({length:7},(_,i)=>{let day=addDays(localDay(),i-6),count=Object.entries(state.done).filter(([k,v])=>k.startsWith(day)&&(v===true||v==='done')).length;return `<div class="daybar" aria-label="${esc(day)}: ${count} completed steps"><i style="height:${Math.min(55,count*7)+4}px"></i><span>${new Date(day+'T12:00:00').toLocaleDateString(undefined,{weekday:'narrow'})}</span><small>${count}</small></div>`}).join('')+'</div>'}
function contextNote(){if(!state.context.outdoors&&!state.context.travel)return '';return `<section class="section card soft"><div class="eyebrow">YOUR CONTEXT / SELF-REPORTED</div><h3>${state.context.travel?'Care, wherever you are.':'A little sun awareness.'}</h3><p>${state.context.travel?'Pack the familiar products that suit you; travel alone does not require a new routine. ':''}${state.context.outdoors?'For outdoor time, AAD recommends broad-spectrum, water-resistant SPF 30+, with reapplication every two hours or after swimming or sweating. Seek shade and wear protective clothing.':''}</p>${link(sources.travel,'Read AAD travel guidance','source')} <button class="textbutton" data-action="context">Edit context</button></section>`}
function pack(p){let photo=p.productPhotos?.find(x=>x.angle==='Front label')?.data||p.productPhotos?.[0]?.data;if(safePhoto(photo))return '<div class="product-art actual"><img src="'+photo+'" alt="Your photo of '+esc(p.name)+'"><small>YOUR PRODUCT PHOTO</small></div>';return '<div class="product-art category-'+p.category.toLowerCase().replaceAll(' ','-')+'" aria-label="'+esc(p.category)+' category illustration, not actual product packaging"><div class="bottle '+(p.kind==='jar'?'jar':p.kind==='serum'?'serum':'')+'"><span>'+esc(p.category.toUpperCase())+'</span></div><small>CATEGORY ILLUSTRATION</small></div>'}
function latestPhoto(){for(let c of state.checks){if(c.photo)return c.photo;if(c.photos?.[0])return c.photos[0].data}return null}
function progressPage(){let checks=state.checks,ms=milestones();return heading('YOUR JOURNEY','Notice changes.<br>Keep perspective.','Your photos, your observations, and the routine you followed.',`<div class="actions"><button data-action="export-data">Export history</button><button class="primary" data-action="checkin">${icon('plus')} New check-in</button></div>`)+(!checks.length?`<section class="card empty">${icon('chart')}<h2>Your story starts with a check-in.</h2><p>Take one front selfie in even light to begin your photo record.</p><button class="primary" data-action="checkin">Create a baseline</button></section>`:`<div class="grid"><article class="card"><div class="eyebrow">MOMENTS RECORDED</div><div class="stats">${checks.length}</div><p class="small muted">Your observations · not a clinical score</p></article><article class="card"><div class="eyebrow">FIRST CHECK-IN</div><div class="stats">${dayLabel(localDay(new Date(checks.at(-1).date)))}</div><p class="small muted">${new Date(checks.at(-1).date).getFullYear()}</p></article><article class="card"><div class="eyebrow">LATEST CHECK-IN / YOUR RECORD</div><div class="stats">${checks[0].feel===null?'Photo':checks[0].feel+' <span class="muted" style="font-size:20px">of 5</span>'}</div><p class="small muted">${checks[0].feel===null?'No comfort rating was inferred.':['','Uncomfortable','A little uneasy','Neutral','Comfortable','Very comfortable'][checks[0].feel]}</p></article></div><section class="section"><div class="sectionhead"><h2>A little perspective.</h2><span class="pill">Unenhanced photos</span></div>${checks.length<2?'<div class="card"><h3>One moment saved.</h3><p class="muted">Add a later check-in to compare. We won’t show the same entry as a before-and-after result.</p></div>':comparison()}<p class="note">Match lighting, distance, angle and makeup conditions. Appearance differences do not prove that a product caused a change. Earlier comfort ratings are self-reported.</p></section><section class="section card"><h2>Your timeline</h2>${checks.map(c=>`<div class="history">${c.photo?`<img src="${c.photo}" alt="Photo from ${esc(dayLabel(localDay(new Date(c.date))))}">`:icon('leaf')}<div><strong>${esc(c.label)}</strong><p>${dayLabel(localDay(new Date(c.date)))} · ${c.feel===null?'Photo record':'Comfort '+c.feel+'/5'} · routine v${Number(c.routineVersion)||1}</p><p>${esc(c.note||(c.photo||c.photos?.length?'Photo check-in.':'Reflection-only check-in.'))}</p>${c.sensation&&c.sensation!=='None'?`<span class="pill warn">${esc(c.sensation)}</span>`:''}</div><div class="actions"><button data-view-check="${esc(c.id)}">View</button><button class="textbutton" data-remove-check="${esc(c.id)}">Remove</button></div></div>`).join('')}</section>`)+`<section class="section card"><div class="eyebrow">PRODUCT CHECKPOINTS</div><h2>Check back with a reason.</h2>${ms.length?`<div class="milestones">${ms.slice(0,8).map(milestoneCard).join('')}</div>`:'<p class="muted">Add a confirmed product and start date to your plan. Each product gets an early comfort check and a separate review date.</p>'}</section>`}
function comparison(){let checks=state.checks;let ids=compareSelection||[checks.at(-1).id,checks[0].id];return `<div class="photogrid">${ids.map((id,slot)=>{let c=checks.find(x=>x.id===id)||checks[slot===0?checks.length-1:0],photo=c.photo||c.photos?.[0]?.data;return `<article class="card"><label>${slot===0?'Baseline / first moment':'Compare with'}<select data-compare="${slot}">${checks.map(v=>`<option value="${esc(v.id)}" ${v.id===c.id?'selected':''}>${dayLabel(localDay(new Date(v.date)))} · ${esc(v.label)}</option>`).join('')}</select></label><div class="photowell">${photo?`<img src="${photo}" alt="Saved photo: ${esc(c.label)}">`:'<div><p>Reflection-only check-in</p><span class="pill">No photo saved</span></div>'}</div><h3>${esc(c.label)}</h3><p class="small muted">${esc(c.note||'No reflection added.')}</p><span class="pill">${c.feel===null?'Photo record · no rating':'Comfort '+c.feel+'/5 · self-reported'}</span></article>`}).join('')}</div>${ids[0]===ids[1]?'<p class="warning">You selected the same record twice. Choose a different check-in for comparison.</p>':''}`}
function guidePage(){return heading('A LITTLE GUIDANCE','Understand your plan.','Clear explanations, with sources you can inspect.')+`<div class="two"><section class="card"><span class="pill">Rule-based guide · live AI not connected</span><h2 style="margin-top:18px">What’s on your mind?</h2><div aria-live="polite" id="chatlog">${chat.length?chat.map(c=>`<div class="chatbubble ${c.user?'user':''}">${c.html||esc(c.text)}</div>`).join(''):'<p class="muted">Ask about your routine, product checkpoints, photo privacy, or travel. This guide uses prepared rules and your local plan.</p>'}</div><div class="quickqs">${['Why this routine?','When should I check in?','I’m going on vacation','Where are my photos?'].map(q=>`<button data-question="${esc(q)}">${esc(q)}</button>`).join('')}</div><form id="guide-form"><label>Your question<input name="question" required maxlength="500" placeholder="Ask about your plan"></label><button class="primary" type="submit">Ask the guide ${icon('arrow')}</button></form></section><aside class="stack"><section class="card soft"><div class="eyebrow">YOUR PLAN AT A GLANCE</div><h3>${esc(state.profile?.pace||'No profile yet')}</h3><p>${state.shelf.filter(p=>p.include&&p.confirmed).length} confirmed products selected. ${state.checks.length} check-ins recorded.</p><p class="small muted">${state.profile?.goals?.length?'Your focus: '+esc(state.profile.goals.join(' · ')):'Photo observations and product sources appear in your photo review. No goals or medical history are inferred.'}</p><a href="#routine" class="textbutton">Open my routine ${icon('arrow')}</a></section><section class="card"><h3>Care when you need it.</h3><p class="muted small">This guide cannot diagnose conditions, assess a reaction, or change prescriptions. Persistent, painful, rapidly changing, or concerning skin problems need qualified care.</p><button data-action="reaction">Review a concern</button></section></aside></div><section class="section"><h2>Read the source.</h2><div class="sourcecards">${link(sources.basics,'Simple skincare basics<small>American Academy of Dermatology</small>')}${link(sources.photos,'Taking useful skin photos<small>American Academy of Dermatology</small>')}${link(sources.test,'Testing a new product<small>American Academy of Dermatology</small>')}${link(sources.travel,'Skincare while traveling<small>American Academy of Dermatology</small>')}</div></section>`}
function settingsPage(){return heading('YOUR SPACE / YOUR CHOICE','Care that fits your day.','Your preferences, privacy, and reminders in one place.')+`<div class="two"><div class="stack"><section class="card"><div class="row"><h2>My reminders</h2>${icon('bell')}</div><p class="muted">Set your routine times. Download daily routine events and dated front-selfie checkpoints for your calendar.</p><form id="reminder-form"><div class="formgrid"><label>Morning routine<input type="time" name="morning" value="${esc(state.settings.morning)}" required></label><label>Evening routine<input type="time" name="evening" value="${esc(state.settings.evening)}" required></label></div><p class="small muted">Calendar events use local time and begin today. Configure notifications and travel timezone behavior in your calendar app.</p><div class="actions"><button class="primary" type="submit">Save times</button><button type="button" data-action="calendar">Download calendar reminders</button></div></form><hr class="divider"><div class="settingsrow"><div><strong>Phone push notifications</strong><p>Requires a connected delivery service and platform permission.</p></div><span class="pill warn">Not connected</span></div><div class="settingsrow"><div><strong>SMS reminders</strong><p>No phone number is collected. Delivery and consent service are not connected.</p></div><span class="pill warn">Not connected</span></div><div class="settingsrow"><div><strong>Message preview</strong><p>“Your evening routine is ready when you are.”</p></div><span class="pill">Example only</span></div></section><section class="card"><h2>Your saved data</h2><p>Preferences, shelf, check-ins and photos stay in this browser. There is no account, cloud backup or cross-device sync. A configured AI service receives selected photos only after explicit review consent.</p><p class="small muted">Other people using this browser can access these records. Browser storage can be cleared by the device or browser. Export a copy if you want to keep it.</p><div class="actions"><button data-action="export-data">Export my records</button><button data-action="clear-confirm">Clear Beauty data</button></div></section></div><aside class="stack"><section class="card soft"><div class="settingsrow"><div><h3>Appearance</h3><p>${state.settings.theme==='dark'?'Dark':'Light'} mode</p></div><button data-action="theme">${icon(state.settings.theme==='dark'?'sun':'moon')} ${state.settings.theme==='dark'?'Light':'Dark'}</button></div><div class="settingsrow"><div><h3>Explore the experience</h3><p>Try sample shelf entries and reflections without changing your records.</p></div><button data-action="${demo?'exit-demo':'demo'}">${demo?'Exit sample':'Try sample'}</button></div></section><section class="card"><div class="eyebrow">BUILD ${BUILD}</div><h3>What works in this preview</h3><p class="small muted">Camera capture and uploads, photo-first selfie-to-shelf setup, source-backed review integration, per-product label photos, routines, product checkpoints, local journal, calendar export, and dark mode.</p><h3>Connection status</h3><p class="small muted">Skin analysis, photo product recognition, live internet product search, photo comparison, clinical advice, push/SMS delivery, accounts and cloud storage are not connected. This is a cosmetic planning preview, not a dermatologist.</p></section><section class="card"><h3>Source information</h3><p class="small muted">Example product pages checked 17 Oct 2026. Always inspect your own label for formulation changes. No live stock or prices are shown.</p><a href="#guide" class="textbutton">View educational sources ${icon('arrow')}</a></section></aside></div>`}
function render(){let route=location.hash.slice(1)||'today';if(route==='main')route='today';if(route==='discover')route='shelf';document.body.classList.toggle('dark',state.settings.theme==='dark');document.body.classList.toggle('photo-onboarding',route==='start');const nav=[['today','sun','Overview'],['routine','sun','Routine'],['shelf','shelf','My products'],['progress','chart','Progress'],['guide','guide','Guide']];$('#nav').innerHTML=nav.map(([key,ico,label])=>`<a href="#${key}" ${route===key||route==='start'&&key==='profile'||false?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></a>`).join('');$('#build').textContent=`Build ${BUILD}`;$('#settings-button').innerHTML=icon('settings');$('#settings-button').setAttribute('aria-label','Open Settings');let notice=demo?'<div class="notice"><span><strong>Sample experience</strong> · Illustrative entries. Your personal records are kept separate.</span><button data-action="exit-demo">Exit sample</button></div>':storageWarning?'<div class="notice"><span><strong>Storage needs attention.</strong> Changes may not be saved. Export your records before continuing.</span><a href="#settings">Settings</a></div>':state.migrated?'<div class="notice"><span>Your previous profile and journal are preserved. Add real products to make the new routine yours.</span><button data-action="dismiss-migration">Got it</button></div>':'';$('#main').innerHTML=notice+({today:photoHome,start:startPage,shelf:shelfPage,profile:profilePage,routine:routinePage,progress:progressPage,guide:guidePage,settings:settingsPage}[route]||photoHome)();document.title=`SPREEAI Beauty · ${route==='profile'?'Skin':route.charAt(0).toUpperCase()+route.slice(1)} · ${BUILD}`}
function navigate(route){closeModal();if(location.hash==='#'+route)render();else location.hash=route;window.scrollTo(0,0)}
function stopCamera(){cameraGeneration++;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
function closeModal(){stopCamera();if($('#modal').open)$('#modal').close()}
function modal(html){stopCamera();if(document.body.classList.contains('b2c-embedded'))parent.postMessage({type:'spreeai:skincare-route'},location.origin);if(!$('#modal').open){lastFocus=document.activeElement;$('#modal').showModal()}$('#modalbody').innerHTML=html;$('#modal').scrollTop=0;requestAnimationFrame(()=>$('#modalbody').querySelector('input:not([type=checkbox]),select,button')?.focus())}
function catalogDetails(id){let p=catalog.find(x=>x.id===id);if(!p)return;modal(`${pack(p)}<div class="eyebrow" style="margin-top:20px">${esc(p.brand)} / US SOURCE</div><h2>${esc(p.name)}</h2><p>${esc(p.detail)}</p><p class="small muted">${esc(p.ingredients)}</p><h3>Label guidance</h3><p>${esc(p.use)}</p><h3>Review timing</h3><p>${esc(p.claim)}</p><p class="source">Manually checked 17 Oct 2026 · ${esc(p.reviewType)}. This record is not a complete safety assessment.</p><div class="actions">${link(p.source,'Open official product page','button')}<button class="primary" data-add-catalog="${p.id}">I own this product</button></div>`)}
function addProduct(id='',catalogId='',keepPhotos=false){let raw=state.shelf.find(p=>p.id===id),cat=catalog.find(p=>p.id===catalogId),p=raw?resolve(raw):cat||{};let branded=p.catalogId||cat?.id||'';pendingProductPhotos=structuredClone(keepPhotos?pendingProductPhotos:raw?.productPhotos||[]);productPhotoBusy=0;productFormGeneration++;captureTarget='product';currentAngle='Front label';modal(`<div class="eyebrow">MY SHELF / ${raw?'EDIT PRODUCT':'CONFIRM A PRODUCT'}</div><h2>${raw?'Keep your shelf current.':'Make it yours.'}</h2><p class="muted small">Confirm the exact product and label yourself. Photo recognition and automatic allergy screening are not connected.</p>${false?`<label>Start from a sourced example<select id="catalog-picker"><option value="">Add my own product</option>${catalog.map(c=>`<option value="${c.id}">${esc(c.brand+' · '+c.name)}</option>`).join('')}</select></label>`:''}<form id="product-form" data-edit="${esc(id)}"><input type="hidden" name="catalogId" value="${esc(branded)}">${productPhotoPanel()}<div class="formgrid"><label>Brand<input name="brand" maxlength="60" value="${esc(p.brand)}" placeholder="Your product’s brand"></label><label>Product name<input name="name" maxlength="100" required value="${esc(p.name)}" placeholder="Exact name and strength"></label></div><div class="formgrid"><label>Category<select name="category">${['Cleanse','Moisturize','Protect','Optional care','Treatment','Other'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>When you use it<select name="period">${['Both','Morning','Evening'].map(c=>`<option ${p.period===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="formgrid"><label>Start date<input type="date" name="start" required max="${localDay()}" value="${esc(p.start||localDay())}"></label><label>Review after (days)<input type="number" name="review" min="1" max="90" required value="${p.review||14}"></label></div><label>Your label directions (optional)<textarea name="directions" rows="2" maxlength="500" placeholder="Write instructions from your own package">${esc(p.directions)}</textarea></label><p class="note">An early comfort check is scheduled at day 3. Your chosen review is separate. ${cat?.id==='ordinary-niacinamide'||branded==='ordinary-niacinamide'?'The seven-day example reflects the manufacturer’s texture claim, not a guarantee.':'A 14-day default is a planning choice, not a promise about results.'}</p>${p.source?link(p.source,'Read the official source','source'):''}<label class="checkbox"><input type="checkbox" name="confirmed" ${raw?.confirmed?'checked':''}>I checked my product’s name, strength, ingredients, warnings and market label. I’ll follow its instructions.</label><label class="checkbox"><input type="checkbox" name="include" ${raw?.include?'checked':''}>Include this product in my plan when eligible.</label><p class="small muted">Treatment and Other categories stay outside the automated plan. Optional active care is restricted; a photo cannot establish suitability. This app does not change prescriptions.</p><label class="checkbox"><input type="checkbox" name="consent" required>I agree to save this product record and any label photos on this browser.</label><div class="actions"><button id="save-product" type="submit" class="primary">${raw?'Save changes':'Add to my shelf'}</button>${raw?`<button type="button" data-archive-item="${esc(raw.id)}">Remove from shelf</button>`:''}</div></form>`)}
function productPhotoPanel(){return '<section class="product-capture" id="product-photo-panel"><div class="row"><div><div class="eyebrow">01 / CAPTURE YOUR PRODUCT</div><h3>Front first. Label next.</h3></div>'+icon('camera')+'</div><p class="small muted">Use the camera button on a phone, choose a saved image, or enable your laptop camera. Product recognition is not connected; you’ll confirm the name below.</p><div class="label-photos">'+['Front label','Back label'].map((angle,i)=>{let p=pendingProductPhotos.find(p=>p.angle===angle);return '<div><div class="label-photo" id="product-preview-'+i+'">'+(p?'<img src="'+p.data+'" alt="Selected '+angle+'">':icon('camera'))+'</div><label class="uploadlabel">'+(i?'Ingredients & directions':'Front of product')+'<span class="upload-hint">Take photo / upload</span><input type="file" data-product-upload="'+angle+'" accept="image/jpeg,image/png,image/webp" capture="environment"></label><button class="textbutton small" type="button" data-remove-product-photo="'+angle+'" '+(p?'':'hidden')+'>Remove photo</button></div>'}).join('')+'</div><details><summary>Use my laptop camera</summary><div class="photo-frame"><video id="camera-preview" autoplay playsinline muted hidden></video><div id="camera-placeholder" class="small muted">Camera off. Enable when ready.</div></div><div class="tabs" aria-label="Product label side"><button type="button" data-product-angle="Front label" aria-pressed="true">Front label</button><button type="button" data-product-angle="Back label" aria-pressed="false">Back label</button></div><div class="actions"><button type="button" data-action="start-camera">Enable camera</button><button type="button" id="capture-button" data-action="take-photo" disabled>Take front label photo</button></div></details><p class="quality" id="capture-quality" aria-live="polite">JPG, PNG or WebP · up to 12 MB each. Saved locally when you save this product.</p></section>'}
function refreshProductPhotos(){['Front label','Back label'].forEach((a,i)=>{let p=pendingProductPhotos.find(p=>p.angle===a),el=$('#product-preview-'+i);if(el)el.innerHTML=p?'<img src="'+p.data+'" alt="Selected '+a+'">':icon('camera');let remove=document.querySelector('[data-remove-product-photo="'+a+'"]');if(remove)remove.hidden=!p})}
function showItem(id){let raw=state.shelf.find(p=>p.id===id);if(!raw)return;let p=resolve(raw),status=stepStatus(p),active=[...routine('Morning'),...routine('Evening')].some(x=>x.id===id),canChoose=p.confirmed&&!['Treatment','Other'].includes(p.category)&&(p.category!=='Optional care'||state.profile?.pace==='A little extra care'&&!state.profile?.sensitive&&!state.profile?.avoid&&state.profile?.adult);modal(`<div class="eyebrow">${esc(p.brand||'MY SHELF')} / ${esc(p.category)}</div>${pack(p)}<h2>${esc(p.name)}</h2><span class="pill ${p.confirmed?'good':'warn'}">${p.confirmed?'Label confirmed by you':'Awaiting label confirmation'}</span><h3 style="margin-top:24px">How it fits</h3><p>${p.category==='Treatment'?'Kept outside the automated routine. Follow your clinician’s instructions.':p.category==='Optional care'&&state.profile?.pace!=='A little extra care'?'Your Simple preference excludes optional care from the routine.':p.confirmed&&p.include?'Selected by you for '+esc(p.period.toLowerCase())+' care. Eligibility also depends on your current preferences.':'This stays on your shelf until confirmed and selected for your plan.'}</p>${canChoose&&!active?'<p class="note">Use in my routine makes this your preferred product for its category and selected time. Your other products stay on your shelf.</p>':''}<p>${esc(p.directions||p.use||'Follow the exact instructions on your own label. This product has no verified directions in this preview.')}</p>${p.productPhotos?.length?`<details><summary>Your saved label photos</summary>${p.productPhotos.map(x=>`<h3>${esc(x.angle)}</h3><img class="entryphoto" src="${x.data}" alt="Your ${esc(x.angle)} of ${esc(p.name)}">`).join('')}</details>`:''}<h3>Your checkpoints</h3><p>Comfort check: ${dayLabel(addDays(p.start,3))}<br>Product review: ${dayLabel(addDays(p.start,p.review))}</p><p class="small muted">${esc(p.claim||'Your review date is a planning preference. The app does not predict results.')}</p>${p.source?link(p.source,'Official produ const BEAUTY_SERVICE_ORIGIN='';
let flowDraft=null,flowBusy=0,flowGeneration=0,flowStatus='idle',flowError='',reviewBusy=false;
function flowFresh(){return {step:0,selfies:[],shelfPhotos:[],noProducts:false,photoFirst:false,basicPlan:false,review:null,baselineId:null,completed:false,savedAt:null}}
function flowPhotos(items,kind){return Array.isArray(items)?items.filter(p=>p&&safePhoto(p.data)&&(kind!=='skin'||p.angle==='Front')).slice(0,kind==='skin'?1:4).map(p=>({angle:String(p.angle||'Shelf').slice(0,30),data:safePhoto(p.data)})):[]}
function normalizeFlow(raw){let f=flowFresh();if(!raw||typeof raw!=='object')return f;f.selfies=flowPhotos(raw.selfies,'skin');f.shelfPhotos=flowPhotos(raw.shelfPhotos,'shelf');f.noProducts=raw.noProducts===true;f.step=Math.max(0,Math.min(2,Number(raw.step)||0));if(!f.selfies.some(p=>p.angle==='Front'))f.step=0;else if(!f.shelfPhotos.length&&!f.noProducts)f.step=Math.min(1,f.step);f.photoFirst=raw.photoFirst!==false;f.basicPlan=raw.basicPlan===true;f.baselineId=typeof raw.baselineId==='string'?raw.baselineId:null;f.savedAt=typeof raw.savedAt==='string'?raw.savedAt:null;f.review=normalizePhotoReview(raw.review);f.completed=raw.completed===true&&!!f.baselineId;return f}
function normalizePhotoReview(raw){
 if(!raw||raw.status!=='complete'||raw.provider!=='OpenAI'||!Array.isArray(raw.sources)||!Array.isArray(raw.observations))return null;
 const refs=raw.sources.filter(s=>s&&safeUrl(s.url)).slice(0,40).map(s=>({url:safeUrl(s.url),title:String(s.title||new URL(s.url).hostname).slice(0,180)})),urls=new Set(refs.map(s=>s.url));
 const clean=p=>{if(!p||typeof p.name!=='string'||!urls.has(safeUrl(p.source)))return null;let category=['Cleanse','Moisturize','Protect','Optional care','Treatment','Other'].includes(p.category)?p.category:'Other';let claim=p.timeline&&Number.isInteger(p.timeline.days)&&p.timeline.days>0&&p.timeline.days<=180&&urls.has(safeUrl(p.timeline.source))?{days:p.timeline.days,metric:String(p.timeline.metric||'Manufacturer-stated observation').slice(0,140),source:safeUrl(p.timeline.source),evidence:String(p.timeline.evidence||'').slice(0,240),kind:'Manufacturer claim'}:null;return {id:String(p.id||uid()).slice(0,100),name:p.name.slice(0,140),brand:String(p.brand||'').slice(0,80),category,source:safeUrl(p.source),retailers:Array.isArray(p.retailers)?p.retailers.filter(u=>urls.has(safeUrl(u))).slice(0,4).map(safeUrl):[],directions:String(p.directions||'Read your exact package directions.').slice(0,600),reason:String(p.reason||'Review the source and package.').slice(0,500),identity:['clear','uncertain'].includes(p.identity)?p.identity:'uncertain',fit:['basic','review','unresolved'].includes(p.fit)?p.fit:'unresolved',timeline:claim,period:category==='Protect'?'Morning':'Both',checkedAt:String(raw.checkedAt||'').slice(0,40)}};
 return {status:'complete',provider:'OpenAI',checkedAt:String(raw.checkedAt||'').slice(0,40),observations:raw.observations.filter(o=>o&&typeof o==='object').slice(0,6).map(o=>({label:String(o.label||'Photo observation').slice(0,100),description:String(o.description||'').slice(0,500),certainty:['uncertain','possible','visible'].includes(o.certainty)?o.certainty:'uncertain'})),limitations:Array.isArray(raw.limitations)?raw.limitations.filter(x=>typeof x==='string').slice(0,6).map(x=>x.slice(0,400)):[],owned:(Array.isArray(raw.owned)?raw.owned:[]).map(clean).filter(Boolean).slice(0,12),recommendations:(Array.isArray(raw.recommendations)?raw.recommendations:[]).map(clean).filter(Boolean).slice(0,8),sources:refs};
}
function ensureFlowDraft(){if(!flowDraft)flowDraft=structuredClone(state.flow||flowFresh());return flowDraft}
function beginPhotoFlow(){flowDraft=structuredClone(state.flow||flowFresh());flowDraft.photoFirst=true;flowGeneration++;flowStatus='idle';flowError='';captureTarget=flowDraft.step===1?'onboarding-shelf':'onboarding-skin';currentAngle='Front';navigate('start')}

function photoHome(){let f=state.flow||flowFresh(),has=!!f.selfies.length;return '<section class="daily-hero"><div class="daily-copy"><div class="eyebrow">SPREEAI BEAUTY / PHOTO FIRST</div><h1>Your skin.<br><span>Start with a selfie.</span></h1><p>A selfie. A photo of your skincare. One place for your routine, real product sources, and your next check-in.</p><div class="actions"><button class="primary" data-action="photo-start">'+icon('camera')+' '+(has?'Continue my skin review':'Start with my selfie')+'</button>'+(f.review?'<a class="button" href="#routine">My routine '+icon('arrow')+'</a>':'<button class="textbutton" data-action="demo">Explore a sample</button>')+'</div><div class="hero-foot">No skin questionnaire <span>·</span> '+(f.review?'Photo observations with source links':'AI review is not connected in this preview')+'</div></div><div class="daily-art" aria-label="Abstract light and stone forms"><div class="arch"></div><div class="stone"></div><span class="art-caption">SEE IT. KNOW IT. CARE FOR IT.</span><div class="art-chip">'+icon('camera')+' A simpler starting point</div></div></section><section class="start-path"><button data-action="photo-start"><span>01</span><div><strong>Your selfie</strong><small>One front selfie.</small></div>'+icon('arrow')+'</button><button data-action="photo-start"><span>02</span><div><strong>Your whole shelf</strong><small>Photograph what you already own.</small></div>'+icon('arrow')+'</button><button data-action="photo-start"><span>03</span><div><strong>Your review & routine</strong><small>Real products. Sources. Checkpoints.</small></div>'+icon('arrow')+'</button></section>'+(has?'<section class="section card"><div class="row"><div><div class="eyebrow">YOUR PHOTOS</div><h2>'+(f.review?'Your photo review is ready.':'Your starting point is saved.')+'</h2><p class="muted">'+f.selfies.length+' skin photo(s) · '+f.shelfPhotos.length+' skincare photo(s). '+(f.review?'Review the findings and product sources before starting.':'No skin assessment or product recommendation has been generated.')+'</p></div><button data-action="photo-start">Resume '+icon('arrow')+'</button></div></section>':'')+(state.shelf.length?'<div class="section two"><section class="card"><div class="eyebrow">'+period.toUpperCase()+' / YOUR SELECTED PRODUCTS</div><h2>Your daily care.</h2><div class="tabs"><button data-period="Morning" aria-pressed="'+(period==='Morning')+'">Morning</button><button data-period="Evening" aria-pressed="'+(period==='Evening')+'">Evening</button></div>'+routineSteps()+'<a href="#routine" class="textbutton">View full routine '+icon('arrow')+'</a></section><section class="card soft"><div class="eyebrow">YOUR NEXT CHECKPOINT</div>'+(milestones()[0]?milestoneCard(milestones()[0]):'<h2>Check in with a reason.</h2><p>Checkpoints begin when you start a selected product. A dated manufacturer claim gets its own observation window.</p>')+'<button data-action="checkin">'+icon('camera')+' Photo check-in</button></section></div>':'')+suggestionsSection(true)}
function startPage(){let f=ensureFlowDraft(),step=f.step;captureTarget=step===1?'onboarding-shelf':'onboarding-skin';return '<div class="photo-flow"><div class="flow-top"><a href="#today" class="textbutton">Back to Today</a><span class="eyebrow">PHOTOS → REVIEW → ROUTINE</span></div>'+flowStepper(step)+(step<2?captureFlowPage(f):reviewFlowPage(f))+'</div>'}
function captureFlowPage(f){let skin=f.step===0,items=skin?f.selfies:f.shelfPhotos,selected=skin?items.find(p=>p.angle===currentAngle):items.at(-1),ready=skin?items.some(p=>p.angle==='Front'):items.length>0;return '<div class="flow-heading"><div class="eyebrow">'+(skin?'01 / YOUR STARTING POINT':'02 / THE SKINCARE YOU OWN')+'</div><h1>'+(skin?'A selfie. In good light.':'Your whole shelf.<br>One photo to start.')+'</h1><p>'+(skin?'Face the camera straight on in bright, even light. Keep filters off and your face in focus.':'Place your skincare together with the names facing forward. Add another photo for labels that are hard to read.')+'</p></div><div class="flow-capture-grid"><section class="card camera-card"><div class="photo-frame flow-frame">'+(selected?'<img id="flow-selected-photo" src="'+selected.data+'" alt="Selected '+esc(selected.angle)+' photo">':'')+'<video id="camera-preview" autoplay playsinline muted hidden></video><div id="camera-placeholder" '+(selected?'hidden':'')+' class="camera-placeholder">'+icon(skin?'skin':'shelf')+'<strong>'+(skin?'Your front photo':'Your products, together')+'</strong><span>Camera off. Ready when you are.</span></div>'+(skin&&!selected?'<div class="frame-outline"></div>':'')+'</div><div class="capturetools"><button data-action="start-camera">'+icon('camera')+' Enable camera</button><button id="capture-button" data-action="take-photo" disabled>Take '+(skin?currentAngle.toLowerCase()+' ':'')+'photo</button><label class="uploadlabel flow-upload">Choose a photo<input type="file" id="flow-upload" accept="image/jpeg,image/png,image/webp" capture="'+(skin?'user':'environment')+'" '+(skin?'':'multiple')+'></label></div><p class="quality" id="capture-quality" aria-live="polite">'+(flowBusy?'Preparing photo…':'JPG, PNG or WebP · up to 12 MB per file. Check focus and lighting yourself.')+'</p>'+(!skin?'<p class="small muted">Up to four photos. Products are identified only when AI review is connected.</p>':'')+'<div class="flow-thumbs">'+items.map((p,i)=>'<div><img src="'+p.data+'" alt="Selected '+esc(p.angle)+' photo"><span>'+esc(p.angle)+'</span><button class="textbutton" data-flow-remove="'+i+'" aria-label="Remove '+esc(p.angle)+' photo">Remove</button></div>').join('')+'</div></section><aside class="stack"><section class="card soft"><div class="eyebrow">'+(skin?'LESS INPUT. A CLEARER START.':'USE WHAT YOU ALREADY HAVE')+'</div><h2>'+(skin?'No skin quiz.<br>No guessing your goals.':'Bring every product into view.')+'</h2><p>'+(skin?'Your next step is a photo of your skincare. The review will separate visible cosmetic observations from things a photo cannot establish.':'The review should show what it identified, what needs a clearer label, and which basic routine steps your shelf could cover.')+'</p><div class="flow-next"><button class="primary" data-action="flow-next" '+(!ready||flowBusy?'disabled':'')+'>'+(skin?'Next: my skincare':'Next: review my photos')+' '+icon('arrow')+'</button>'+(skin?'':'<button class="textbutton" data-action="flow-no-products">I don’t own skincare yet</button><button class="textbutton" data-action="flow-back">Back to my selfie</button>')+'</div><p class="source">Continuing saves these photos in this browser. They are not sent for AI review unless you explicitly choose that step.</p></section><section class="card"><h3>'+(skin?'Keep it consistent.':'Readable beats perfect.')+'</h3><p class="small muted">'+(skin?'Avoid harsh shadows and direct glare. A camera can record appearance; it cannot establish allergies, hydration levels, a diagnosis, or every aspect of skin type.':'A blurry bottle won’t be treated as a confirmed match. Add a close-up if the product name or strength is unclear.')+'</p></section></aside></div>'}
function reviewFlowPage(f){let r=f.review;if(r)return photoResultPage(r);return '<div class="flow-heading"><div class="eyebrow">03 / YOUR PHOTO REVIEW</div><h1>From your photos.<br>To a considered plan.</h1><p>Review what you already own first. Find real products only where they’re useful. Set checkpoints from the source, with uncertainty kept visible.</p></div><div class="two"><section class="card"><div class="review-photo-pair"><div><img src="'+f.selfies.find(p=>p.angle==='Front').data+'" alt="Your front selfie"><strong>Your starting point</strong><span>'+f.selfies.length+' photo(s)</span></div><div>'+(f.shelfPhotos[0]?'<img src="'+f.shelfPhotos[0].data+'" alt="Your skincare shelf">':'<div class="no-shelf-photo">'+icon('shelf')+'</div>')+'<strong>Your skincare</strong><span>'+(f.noProducts?'Starting without products':f.shelfPhotos.length+' photo(s)')+'</span></div></div><div class="review-expectations"><p><strong>01 / Observe</strong> Visible cosmetic appearance, image limitations, and anything that needs a clearer view.</p><p><strong>02 / Research</strong> Product identities, official instructions, and available retail pages—including Amazon where a matching source is found.</p><p><strong>03 / Plan</strong> Basic routine steps and product-specific review windows. A result claim is not a guaranteed outcome.</p></div></section><aside class="stack"><section class="card soft" role="status"><span class="pill '+(flowStatus==='unavailable'?'warn':'')+'">'+(reviewBusy?'Checking your review':flowStatus==='unavailable'?'AI review unavailable':'Ready for the next step')+'</span><h2>'+(flowStatus==='unavailable'?'Photos saved.<br>Review still needs a connection.':'Your review starts here.')+'</h2><p>'+(flowStatus==='unavailable'?'No AI skin observations, product identification, or live internet recommendations have been generated. Your photos remain saved here; you can retry later.':'When connected, this sends the selected photos to OpenAI through the SPREEAI review service. It does not send your name or journal. The service is not connected in this preview.')+'</p>'+(flowError?'<p class="small muted">'+esc(flowError)+'</p>':'')+'<button class="primary" data-action="flow-review" '+(reviewBusy?'disabled':'')+'>'+(reviewBusy?'Review in progress…':flowStatus==='unavailable'?'Check connection again':'Review my photos')+'</button><button class="textbutton" data-action="flow-save-only">Save photos & finish for now</button><button class="textbutton" data-action="flow-back">Back to my products</button></section><section class="card"><h3>Care with perspective.</h3><p class="small muted">Photo observations can’t confirm allergies, medications, pregnancy, or a medical diagnosis. The review cannot declare a product safe for you or replace clinical care.</p>'+link(sources.apps,'Read AAD guidance on skin apps','source')+'</section></aside></div>'}
function photoResultPage(r){return '<div class="flow-heading"><div class="eyebrow">YOUR PHOTO REVIEW / '+esc(r.provider)+'</div><h1>Your skin. Your shelf.<br>A clearer next step.</h1><p>Cosmetic observations from your photos, paired with product pages retrieved for this review. Confirm product identities before starting.</p></div><div class="grid">'+r.observations.map(o=>'<article class="card"><span class="pill">'+esc(o.certainty)+'</span><h3>'+esc(o.label)+'</h3><p>'+esc(o.description)+'</p></article>').join('')+'</div>'+(r.limitations.length?'<div class="note section">'+r.limitations.map(esc).join(' ')+'</div>':'')+'<section class="section"><div class="sectionhead"><div><div class="eyebrow">YOUR SKINCARE / CONFIRM THE MATCHES</div><h2>Start with your own shelf.</h2></div></div>'+(r.owned.length?'<div class="grid">'+r.owned.map(p=>researchProductCard(p,true)).join('')+'</div><p class="note">Use the plan button only if the clear product matches are yours and your exact labels allow this use. Uncertain matches, treatments, and optional active care stay out.</p><button class="primary" data-action="flow-use-owned">These clear matches are mine. Build my basic routine.</button>':'<div class="card"><p>No reliable owned-product match was returned. Nothing has been added to your routine.</p><button data-action="flow-products-again">Add a clearer product photo</button></div>')+'</section>'+suggestionsSection()+'<section class="section card"><h2>The source sets the checkpoint.</h2><p>If a retrieved manufacturer page states a result window, it gets a separate observation check after you start that product. Otherwise, the app labels a comfort check as a planning choice and does not invent an efficacy deadline.</p><a class="textbutton" href="#routine">Review my routine '+icon('arrow')+'</a></section>'}
function researchProductCard(p,owned=false){return '<article class="card research-product"><div class="row"><span class="eyebrow">'+esc(p.brand||'RETRIEVED PRODUCT')+'</span><span class="pill">'+esc(p.category)+'</span></div><h3>'+esc(p.name)+'</h3>'+(owned?'<span class="pill '+(p.identity==='clear'&&p.fit==='basic'?'':'warn')+'">'+(p.identity!=='clear'?'Needs a clearer label':p.fit==='basic'?'Candidate for a basic step':'Needs review before use')+'</span>':'')+'<p>'+esc(p.reason)+'</p><details><summary>Instructions & checkpoint</summary><p>'+esc(p.directions)+'</p><p>'+esc(p.timeline?'Manufacturer observation: '+p.timeline.metric+' · '+p.timeline.days+' days after first use.':'No sourced efficacy timeline. A comfort check can be recorded separately.')+'</p>'+(p.timeline?link(p.timeline.source,'Timeline source','source'):'')+'</details><div class="actions">'+link(p.source,'Product source','button')+(p.retailers||[]).map((u,i)=>link(u,new URL(u).hostname.replace('www.','').includes('amazon.')?'View on Amazon':'Retailer '+(i+1),'textbutton')).join('')+'</div>'+(!owned&&p.identity==='clear'&&p.fit==='basic'?'<button class="primary" data-reviewed-product="'+esc(p.id)+'">I have this product</button>':'')+'<p class="source">Retrieved '+esc(p.checkedAt?new Date(p.checkedAt).toLocaleDateString():'for this review')+' · Check current price, seller and exact label at the source.</p></article>'}
function suggestionsSection(compact=false){let r=state.flow?.review||flowDraft?.review,picks=r?.recommendations||[];if(!r)return '<section class="section card photo-research-empty"><div class="eyebrow">PRODUCTS / FOUND FOR YOUR REVIEW</div><h2>Real sources. No preloaded picks.</h2><p class="muted">Photo-based recommendations will appear here after a connected AI review and live product search. No product has been selected from your selfie yet.</p><button data-action="photo-start">'+icon('camera')+' Continue with photos</button></section>';return '<section class="section recommendations"><div class="sectionhead"><div><div class="eyebrow">LIVE RESEARCH / YOUR PHOTO REVIEW</div><h2>'+(picks.length?'Products to consider. Sources to inspect.':'No additional products suggested.')+'</h2></div></div><p class="muted">'+(picks.length?'These are real product pages retrieved for this review. They are cosmetic suggestions, not an allergy assessment or treatment plan.':'The review did not return a source-backed product to add. Your existing shelf may be enough; no generic shopping feed is substituted.')+'</p><div class="grid">'+picks.slice(0,compact?3:8).map(p=>researchProductCard(p)).join('')+'</div></section>'}

async function runPhotoReview(){if(reviewBusy)return;let f=ensureFlowDraft();if(!persistFlow(2))return;if(demo){flowStatus='unavailable';flowError='Sample mode never uploads images or runs paid analysis.';render();return}if(!BEAUTY_SERVICE_ORIGIN){flowStatus='unavailable';flowError='This build has no connected AI review service. Nothing was uploaded.';render();return}reviewBusy=true;flowStatus='running';flowError='';render();try{let base=new URL(BEAUTY_SERVICE_ORIGIN);if(base.protocol!=='https:'&&base.hostname!=='localhost'&&base.hostname!=='127.0.0.1')throw Error('Review service requires a secure connection.');const status=await fetch(base.origin+'/api/beauty/status',{credentials:'include',signal:AbortSignal.timeout(12000)});if(!status.ok||(await status.json()).ready!==true)throw Error('The AI review service is unavailable. Your photos were not sent.');reviewBusy=false;modal('<div class="eyebrow">YOUR PHOTO REVIEW</div><h2>Review with AI?</h2><p>This sends '+f.selfies.length+' skin photo(s) and '+f.shelfPhotos.length+' skincare photo(s) to OpenAI through the SPREEAI review service. Your name and journal are not included. Product research uses only general cosmetic categories and product names, not your photos.</p><p class="small muted">The review describes cosmetic appearance and uncertainties. It cannot establish medical diagnoses or product safety for you.</p><button class="primary" data-action="flow-send-review">Send these photos for review</button><button data-action="close">Keep photos on this device</button>')}catch(err){flowStatus='unavailable';flowError=err.message||'The review service could not be reached. Your photos remain saved.'}finally{reviewBusy=false;render()}}

function useReviewedOwned(productId=''){let f=ensureFlowDraft(),owned=(productId?f.review?.recommendations?.filter(p=>p.id===productId):f.review?.owned)?.filter(p=>p.identity==='clear'&&p.fit==='basic'&&['Cleanse','Moisturize','Protect'].includes(p.category))||[];if(!owned.length){toast('There are no clear basic-product matches to select.');return}f.basicPlan=true;if(commit(s=>{for(let p of owned){let existing=s.shelf.find(x=>x.source===p.source&&x.name===p.name);let record={...(existing||{}),id:existing?.id||uid(),name:p.name,brand:p.brand,source:p.source,category:p.category,period:p.period,directions:p.directions,confirmed:true,include:true,start:existing?.start||localDay(),review:p.timeline?.days||null,reviewBasis:p.timeline,photoReview:true,priority:Date.now(),productPhotos:existing?.productPhotos||[]};if(existing)Object.assign(existing,record);else s.shelf.push(record)}s.routineVersion++})){finishPhotoBaseline();navigate('routine');toast('Basic matches selected. Follow your exact product labels.')}}

async function flowUpload(input){let files=[...input.files||[]],f=ensureFlowDraft(),generation=flowGeneration,angle='Front',step=f.step;if(!files.length)return;if(step===0)files=files.slice(0,1);else files=files.slice(0,Math.max(0,4-f.shelfPhotos.length));if(!files.length){toast('Four skincare photos are already selected.');return}flowBusy++;stopCamera();input.disabled=true;let next=document.querySelector('[data-action="flow-next"]');if(next)next.disabled=true;try{let results=[];for(let file of files)results.push(await photoFromFile(file));if(generation!==flowGeneration||!input.isConnected)return;for(let result of results){if(step===0){f.selfies=[{angle:'Front',data:result.data}]}else{f.shelfPhotos.push({angle:'Shelf '+(f.shelfPhotos.length+1),data:result.data});f.noProducts=false}}f.review=null;flowError='';flowStatus='idle'}catch(err){if(generation===flowGeneration)toast(err.message||'Photo could not be opened. Your earlier selections were kept.')}finally{flowBusy=Math.max(0,flowBusy-1);if(generation===flowGeneration)render()}}
function checkin(reviewKey='',keepPhotos=false){if(!keepPhotos)pendingPhotos=[];checkReview=reviewKey;let m=milestones().find(x=>x.key===reviewKey);modal('<div class="eyebrow">'+(m?'YOUR PRODUCT CHECKPOINT':'YOUR PHOTO CHECK-IN')+'</div><h2>'+(m?esc(m.title):'A new moment for your skin.')+'</h2><p>'+(m?esc(m.product)+' · '+esc(m.reason):'Take a consistent photo. Your note is optional; there’s no questionnaire.')+'</p><form id="check-form"><input type="hidden" name="label" value="'+esc(m?m.product.slice(0,35)+' · check-in':'Photo check-in')+'"><div class="thumbs" id="check-thumbs">'+pendingPhotos.map(p=>'<div><img src="'+p.data+'" alt="Selected '+esc(p.angle)+' photo"><br>'+esc(p.angle)+'</div>').join('')+'</div><div class="capturetools"><button type="button" data-action="capture-for-check">'+icon('camera')+' Take a photo</button><label class="uploadlabel">Choose a photo<input type="file" id="journal-photo" accept="image/jpeg,image/png,image/webp" capture="user"></label></div><p class="small muted" id="photo-status">'+(pendingPhotos.length?'Your photo is selected.':'One new front selfie is required. Use the same light, distance and camera; keep filters and makeup off when possible.')+'</p><details><summary>Add a note (optional)</summary><textarea name="note" rows="3" maxlength="1000" aria-label="Optional check-in note" placeholder="Anything useful to remember"></textarea></details><p class="source">Saving keeps this entry and its photos in this browser. Other people using this browser can access them.</p><div id="check-error" class="formerror" role="alert"></div><button class="primary" id="save-check" type="submit" '+(!pendingPhotos.some(p=>p.angle==='Front'&&safePhoto(p.data))?'disabled':'')+'>Save check-in</button></form>')}

function milestones(){let all=[],active=new Set([...routine('Morning'),...routine('Evening')].filter(p=>!p.gap).map(p=>p.id));for(let raw of state.shelf){if(!active.has(raw.id)||!raw.confirmed||!raw.include||raw.category==='Treatment'||elapsed(raw.start)<0)continue;let p=resolve(raw),basis=p.reviewBasis&&safeUrl(p.reviewBasis.source)&&Number.isInteger(p.reviewBasis.days)?p.reviewBasis:null;let checkpoints=[{kind:'comfort',days:3,title:'How does it feel?',reason:'Comfort and tolerability · planner timing, not a result claim'}];if(basis)checkpoints.push({kind:'review',days:basis.days,title:basis.metric||'Your product observation',reason:'Manufacturer claim · '+basis.days+' days after first use · individual results vary',source:basis.source});else if(!p.photoReview&&Number(p.review)>0)checkpoints.push({kind:'review',days:p.review,title:'Your product review',reason:p.catalogId==='ordinary-niacinamide'&&p.review===7?'One-week texture self-report · manufacturer claim':'Your chosen reflection date · no promised result',source:p.catalogId==='ordinary-niacinamide'&&p.review===7?safeUrl(p.source):null});for(let c of checkpoints){let day=addDays(p.start,c.days),key=p.id+':'+c.kind+':'+day;if(!state.reviews.includes(key))all.push({...c,day,key,product:p.name})}}let latest=state.checks.find(c=>frontRecord(c));if(latest){let day=addDays(localDay(new Date(latest.date)),28),key='photo-refresh:'+latest.id+':'+day;if(!state.reviews.includes(key))all.push({kind:'refresh',days:28,title:'Your next progress photo',reason:'Every four weeks · planner reminder, not an efficacy deadline',day,key,product:'Your ongoing photo record'})}return all.sort((a,b)=>a.day.localeCompare(b.day))}

let comparisonBusy=false;
function frontRecord(c){return safePhoto(c?.photos?.length?c.photos.find(p=>p.angle==='Front')?.data:c?.photo)}
function comparisonPair(id){let current=state.checks.find(c=>c.id===id);if(!current||!frontRecord(current))return null;let baseline=state.checks.find(c=>c.id===state.flow?.baselineId);if(!baseline||baseline.id===id||!frontRecord(baseline)||Date.parse(baseline.date)>=Date.parse(current.date))baseline=[...state.checks].reverse().find(c=>c.id!==id&&frontRecord(c)&&Date.parse(c.date)<Date.parse(current.date));return baseline?{baseline,current}:null}
function normalizeComparison(raw){if(raw?.status!=='complete'||raw.provider!=='OpenAI'||typeof raw.comparable!=='boolean')return null;let labels=['Tone evenness','Visible texture','Surface shine','Visible flaking'];return {status:'complete',provider:'OpenAI',comparable:raw.comparable,checkedAt:String(raw.checkedAt||'').slice(0,40),limitations:(Array.isArray(raw.limitations)?raw.limitations:[]).filter(s=>typeof s==='string').slice(0,5).map(s=>s.slice(0,400)),changes:raw.comparable?(Array.isArray(raw.changes)?raw.changes:[]).filter(c=>labels.includes(c.label)&&['less visible','more visible','similar','uncertain'].includes(c.change)).slice(0,4).map(c=>({label:c.label,change:c.change,description:String(c.description||'').slice(0,400)})):[]}}
function comparisonPanel(id){let pair=comparisonPair(id);if(!pair)return '';let r=pair.current.comparison?.baselineId===pair.baseline.id?normalizeComparison(pair.current.comparison):null;return '<section class="section card"><div class="eyebrow">BASELINE → NEW FRONT SELFIE</div><h2>'+(r?(r.comparable?'An appearance comparison.':'These photos are not comparable.'):'See what changed, with perspective.')+'</h2><p class="small muted">'+dayLabel(localDay(new Date(pair.baseline.date)))+' → '+dayLabel(localDay(new Date(pair.current.date)))+' · same front view</p>'+(r?r.changes.map(c=>'<article class="comparison-observation"><strong>'+esc(c.label)+' · '+esc(c.change)+'</strong><p>'+esc(c.description)+'</p></article>').join('')+'<p>'+r.limitations.map(esc).join(' ')+'</p>':'<p>Compare the new photo with your baseline. Different lighting, filters, makeup or focus can prevent a useful comparison. AI comparison is not connected in this preview.</p>')+'<p class="note">Visible appearance only. This cannot determine a diagnosis, prove a product is working, or establish which product caused a change.</p><button '+(comparisonBusy?'disabled':'')+' data-compare-photo="'+esc(id)+'">'+(r?'Review comparison again':'Compare with my baseline')+'</button></section>'}
async function requestPhotoComparison(id){if(comparisonBusy||!comparisonPair(id))return;if(demo||!BEAUTY_SERVICE_ORIGIN){modal('<h2>Comparison needs a connection.</h2><p>Your baseline and new front selfie remain saved. No AI comparison has been generated. You can still view both photos in Progress.</p><button data-action="close">Back to my record</button>');return}comparisonBusy=true;try{let response=await fetch(new URL(BEAUTY_SERVICE_ORIGIN).origin+'/api/beauty/status',{credentials:'include',signal:AbortSignal.timeout(10000)}),status=response.ok?await response.json():{};if(!status.ready)throw Error('The comparison service is unavailable.');modal('<h2>Compare these two front selfies?</h2><p>This sends your saved baseline and this check-in photo, with their dates, to OpenAI through the SPREEAI review service. Your product history, name and journal are excluded. Provider data handling applies.</p><p>The review can describe cosmetic appearance differences or say the images are not comparable. It cannot establish treatment success.</p><button class="primary" data-send-comparison="'+esc(id)+'">Send these two photos for comparison</button><button data-action="close">Keep photos on this device</button>')}catch{modal('<h2>Comparison unavailable.</h2><p>Your photos remain saved. No result was assumed.</p><button data-action="close">Back to my record</button>')}finally{comparisonBusy=false}}
async function sendPhotoComparison(id){let pair=comparisonPair(id);if(!pair||comparisonBusy||!BEAUTY_SERVICE_ORIGIN||demo)return;comparisonBusy=true;modal('<h2>Comparing your two photos…</h2><p>Checking image consistency before describing appearance changes.</p>');try{let response=await fetch(new URL(BEAUTY_SERVICE_ORIGIN).origin+'/api/beauty/compare',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({consent:true,baseline:{data:frontRecord(pair.baseline),date:pair.baseline.date},current:{data:frontRecord(pair.current),date:pair.current.date}}),signal:AbortSignal.timeout(90000)});if(!response.ok)throw Error('Comparison unavailable.');let result=normalizeComparison(await response.json());if(!result)throw Error('No complete comparison was returned.');result.baselineId=pair.baseline.id;if(!commit(s=>{let c=s.checks.find(c=>c.id===id);if(c)c.comparison=result}))return;comparisonBusy=false;viewCheck(id)}catch{modal('<h2>Comparison could not finish.</h2><p>Your checkpoint and photos remain saved. No appearance change was assumed.</p><button data-view-check="'+esc(id)+'">View my saved check-in</button>')}finally{comparisonBusy=false}}

progressPage=function(){let latest=state.checks.find(c=>comparisonPair(c.id)),page=progressPageBase();return latest?page.replace('<section class="section card"><h2>Your timeline',comparisonPanel(latest.id)+'<section class="section card"><h2>Your timeline'):page};
function icsText(value){return String(value).replaceAll('\\','\\\\').replaceAll('\n','\\n').replaceAll(',','\\,').replaceAll(';','\\;')}
function exportCalendar(){if(!state.settings.calendarId&&!commit(s=>s.settings.calendarId=uid()))return;let today=localDay(),day=today.replaceAll('-',''),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SPREEAI//Beauty//EN','CALSCALE:GREGORIAN'];for(let [name,time] of [['Morning',state.settings.morning],['Evening',state.settings.evening]])out.push('BEGIN:VEVENT','UID:'+state.settings.calendarId+'-'+name+'@spreeai-beauty','DTSTAMP:'+stamp,'DTSTART:'+day+'T'+time.replace(':','')+'00','DURATION:PT5M','RRULE:FREQ=DAILY','SUMMARY:SPREEAI Beauty - '+name+' routine','DESCRIPTION:Open your saved routine. Choose alerts in your calendar app.','END:VEVENT');let groups=new Map();for(let m of milestones()){let date=m.day<=today?addDays(today,1):m.day;if(!groups.has(date))groups.set(date,[]);groups.get(date).push(m)}for(let [date,list] of groups){let description='Take one new front selfie in the same lighting. '+list.map(m=>m.product+': '+m.reason+(m.source?' Source: '+m.source:'')).join(' · ');out.push('BEGIN:VEVENT','UID:'+state.settings.calendarId+'-photo-'+date+'@spreeai-beauty','DTSTAMP:'+stamp,'DTSTART:'+date.replaceAll('-','')+'T'+state.settings.morning.replace(':','')+'00','DURATION:PT5M','SUMMARY:SPREEAI Beauty - front selfie checkpoint','DESCRIPTION:'+icsText(description),'URL:'+location.origin+location.pathname+'#progress','END:VEVENT')}out.push('END:VCALENDAR');let folded=out.map(line=>{let chunks=[],part='',size=0;for(let ch of line){let n=unescape(encodeURIComponent(ch)).length;if(size+n>73){chunks.push(part);part=' '+ch;size=1+n}else{part+=ch;size+=n}}chunks.push(part);return chunks.join('\r\n')}).join('\r\n');download('SPREEAI-Beauty-Reminders.ics',folded,'text/calendar');toast('Routine and photo checkpoints downloaded. Import into your calendar and choose alerts.')}

if(new URLSearchParams(location.search).has('embedded')){
